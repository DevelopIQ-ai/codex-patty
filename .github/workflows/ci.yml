name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite, which the store depends on, needs >=22.5.
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm openapi:lint
      - run: corepack pnpm build
      - run: corepack pnpm test:unit
      - run: corepack pnpm test:contract
      - run: corepack pnpm test:integration
      - run: corepack pnpm test:e2e:fake
